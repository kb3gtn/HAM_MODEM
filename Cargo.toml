[package]
name = "ham_modem"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
crossbeam-channel = "0.5"
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bladerf = { git = "https://github.com/MerchGuardian/seify-bladerf.git", package = "bladerf" }
num-complex = "0.4"
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
rustfft = "6.4.1"
